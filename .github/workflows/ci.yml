# Checks on every push and pull request; releases to npm (as stets.app) from a version tag.
#
# Releases use npm's trusted publishing (OIDC): no npm token is stored anywhere, and npm adds a provenance
# statement that links each release to this repository, this workflow and the commit it was built from.
# npm trusts: organization stets-app · repository cli · workflow file ci.yml · environment npm, and only to
# *stage* a release (npm's default and advice). A staged version becomes public only when a maintainer approves it
# on npm, with 2FA; the run's summary page says how. The environment "npm" accepts only v* tags (and only admins
# can push those); it has no reviewer, because the approval on npm is the gate.
#
# Release: raise "version" in package.json and VERSION in stets.mjs on main, then
#   git tag v<version> && git push origin v<version>
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # never cancel a release half-way

jobs:
  check:
    # It runs on people's own computers: the oldest Node it claims (18) and the three systems.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 18 }
          - { os: ubuntu-24.04, node: 24 }
          - { os: macos-15, node: 24 }
          - { os: windows-2025, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Parses, and the commands that change nothing run
        shell: bash
        env:
          NO_COLOR: '1'
          STETS_NO_OPEN: '1'
        run: |
          node --check stets.mjs
          test "$(node stets.mjs --version)" = "$(node -p "require('./package.json').version")"
          node stets.mjs help > /dev/null
          node stets.mjs agent status --url http://localhost:9/mcp
          # an unreachable address: setup stops before touching any agent, with exit 1
          if node stets.mjs agent setup --yes --url http://localhost:9/mcp < /dev/null; then echo "setup should have refused"; exit 1; fi
      - name: How agents are started (full path, Stets' own folder, never a decoy in the current folder; cmd.exe on Windows)
        run: node test/safe-run.mjs
      - name: The package holds exactly the CLI, its README, licence and package.json
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: |
          files=$(npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].files.map(f=>f.path).sort().join(" ")))')
          echo "$files"
          test "$files" = "LICENSE README.md package.json stets.mjs"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm # npm's trusted publisher checks this name; only v* tags may use it
    permissions:
      contents: read
      id-token: write # the OIDC token npm checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag names this version, and its commit is on main
        run: |
          v=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$v" || { echo "the tag is $GITHUB_REF_NAME but package.json says $v"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release tags must point at a commit on main"; exit 1; }
      - name: npm 11.15.0 or newer (staged publishing)
        run: |
          node -e 'const [a,b]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&b>=15)?0:1)' "$(npm --version)" || npm install -g npm@11.19.0
          npm --version
      - name: Stage the release on npm (not public until a maintainer approves it there)
        id: stage
        run: |
          set -o pipefail
          npm stage publish --provenance 2>&1 | tee "$RUNNER_TEMP/npm.log"
      - name: "Your turn: approve the release on npm"
        if: success()
        run: |
          v="${GITHUB_REF_NAME#v}"
          sum=$(sed -n 's/.*npm notice shasum: *\([0-9a-f]*\).*/\1/p' "$RUNNER_TEMP/npm.log" | head -1)
          id=$(sed -n 's/.*staged with id \([0-9a-f-]*\).*/\1/p' "$RUNNER_TEMP/npm.log" | head -1)
          echo "::notice title=Your turn - approve stets.app@$v on npm::It is staged, not public. npmjs.com > account settings > Staged Packages > stets.app $v > Approve (2FA). Or in your own terminal: npm stage approve ${id:-<id from npm stage list stets.app>}"
          sed -e "s|@V@|$v|g" -e "s|@SHA@|${GITHUB_SHA:0:7}|g" -e "s|@SUM@|${sum:-in the npm output below}|g" -e "s|@ID@|${id:-<stage id>}|g" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Your turn: approve stets.app@@V@ on npm

          CI has **staged** stets.app@@V@, built from commit @SHA@. It is **not public yet**:
          `npx stets.app` still installs the previous version.

          **On npmjs.com:** sign in, open your account settings, then the **Staged Packages** tab. Find
          **stets.app @V@** and click **Approve** (it asks for your 2FA).

          **Or in your own terminal** (it asks for your 2FA in the browser):

          ```
          npm stage approve @ID@
          ```

          `npm stage list stets.app` lists what is staged, and `npm stage download @ID@` fetches it to look at.

          The staged package's shasum is **@SUM@**. If anything looks unexpected, don't approve it:
          `npm stage reject @ID@` removes it.

          Afterwards, `npm view stets.app version` says @V@, and https://www.npmjs.com/package/stets.app shows
          its provenance: this repository, ci.yml and commit @SHA@.
          EOF
          { echo; echo '<details><summary>npm output</summary>'; echo; echo '```'; cat "$RUNNER_TEMP/npm.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Staging failed (nothing was published)
        if: failure() && steps.stage.outcome == 'failure'
        run: |
          echo "::error title=Staging failed - nothing was published::npm refused to stage the release. Its output is in this run's summary."
          { echo '## Staging failed: nothing was published'; echo; echo 'npm refused to stage the release. Its output:'; echo; echo '```'; cat "$RUNNER_TEMP/npm.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
